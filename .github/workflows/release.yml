name: release

# Push a tag like v0.5.0 to publish. The tag must match app.Version in
# internal/app/app.go, and CHANGELOG.md must have a "## [0.5.0]" section.
# Asset names carry no version so that
# https://github.com/ffqa/xpier-xplan/releases/latest/download/<asset> always
# points at the newest build (scripts/install.sh relies on it).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Tag matches app.Version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME#v}"
          code_version="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/app/app.go)"
          if [ "$tag_version" != "$code_version" ]; then
            echo "::error::tag is $tag_version but internal/app/app.go says $code_version"
            exit 1
          fi
          grep -q "^## \[$tag_version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$tag_version] section"; exit 1; }
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build the web UI once
        working-directory: web
        run: npm ci && npm run build

      - name: Test
        run: go test -count=1 ./...

      - name: Cross-compile and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            name="xplan_${goos}_${goarch}"
            binary="xplan"; [ "$goos" = windows ] && binary="xplan.exe"
            mkdir -p "build/$name"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/ffqa/xpier-xplan/internal/app.Version=$VERSION" \
              -o "build/$name/$binary" ./cmd/xplan
            cp LICENSE README.md "build/$name/"
            if [ "$goos" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\n---\nInstall: `curl -fsSL https://raw.githubusercontent.com/%s/main/scripts/install.sh | sh`\n' "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --title "xplan $VERSION" --notes-file notes.md dist/*
